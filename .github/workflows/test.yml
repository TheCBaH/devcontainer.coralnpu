name: test
on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.arch == 'aarch64' && 240 || 180 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ inputs.arch }}
          path: dist
      - name: Test libc, subsystem
        if: ${{ !cancelled() }}
        run: scripts/test-ci.sh libc subsystem
      - name: Test rtl, kernels
        if: ${{ !cancelled() }}
        run: scripts/test-ci.sh rtl kernels-tcm kernels-highmem
      - name: Test matrix
        if: ${{ !cancelled() }}
        run: scripts/test-ci.sh matrix-fp32 matrix-int8 matrix-bf16 matrix-vme
      - name: Test host, uninit, invalid, limits
        if: ${{ !cancelled() }}
        run: scripts/test-ci.sh host uninit invalid limits
      - name: Test ddr
        if: ${{ !cancelled() }}
        env:
          CORAL_DDR_TIMEOUT: ${{ inputs.arch == 'aarch64' && '3600' || '1200' }}
        run: scripts/test-ci.sh ddr-rtl ddr-mpact ddr-host
      - name: Collect fixture results
        run: make results
      - name: Upload verified archives
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: archives-${{ inputs.arch }}
          path: dist/*
          if-no-files-found: error
      - name: Retry verified archive upload
        id: upload_retry
        if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: archives-${{ inputs.arch }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
      - name: Final verified archive upload attempt
        if: ${{ !cancelled() && steps.upload_retry.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: archives-${{ inputs.arch }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
