name: test
on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ inputs.arch }}
          path: dist
      - name: Test archives
        run: scripts/test-ci.sh
      - name: Collect fixture results
        run: make results
      - name: Upload verified archives
        uses: actions/upload-artifact@v7
        with:
          name: archives-${{ inputs.arch }}
          path: dist/*
          if-no-files-found: error
