name: build
on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:
    inputs:
      x86_only:
        description: 'Skip the ARM64 builds'
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
  packages: write
  actions: write
concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize source
        run: make submodule
      - name: Free runner disk
        run: |
          sudo find /usr/local/lib/android /usr/share/dotnet /opt/ghc -depth -delete 2>/dev/null || true
          df -h
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Set command prefix
        run: echo 'EXEC=${{ steps.container.outputs.exec }}' >> "$GITHUB_ENV"
      - name: Cache ID
        id: cache-id
        run: echo "coralnpu=$(git rev-parse --short=12 HEAD:coralnpu)" >> "$GITHUB_OUTPUT"
      - name: Restore Bazel repository cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/repos/content_addressable
          key: downloads-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}
          restore-keys: downloads-${{ runner.arch }}-
      - name: Restore Bazel action cache
        id: actions-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/actions
          key: actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-${{ github.run_id }}
          restore-keys: |
            actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-
            actions-${{ runner.arch }}-
      - name: Build guest fixtures
        run: $EXEC make fixtures
      - name: Test RTL retirement
        run: $EXEC make rtl-tests
      - name: Upload guest fixtures
        uses: actions/upload-artifact@v7
        with:
          name: guest-fixtures
          path: |
            fixtures/*.elf
            fixtures/*.ld
          if-no-files-found: error
  dma-tests:
    name: DMA and TileLink
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize source
        run: make submodule
      - name: Free runner disk
        run: |
          sudo find /usr/local/lib/android /usr/share/dotnet /opt/ghc -depth -delete 2>/dev/null || true
          df -h
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Cache ID
        id: cache-id
        run: echo "coralnpu=$(git rev-parse --short=12 HEAD:coralnpu)" >> "$GITHUB_OUTPUT"
      - name: Restore Bazel repository cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/repos/content_addressable
          key: downloads-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}
          restore-keys: downloads-${{ runner.arch }}-
      - name: Restore Bazel action cache
        id: actions-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/actions
          key: actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-${{ github.run_id }}
          restore-keys: |
            actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-
            actions-${{ runner.arch }}-
      - name: Test DMA, TileLink and DDR paths
        run: ${{ steps.container.outputs.exec }} make dma-tests
      - name: Collect test logs
        if: always() && steps.container.outcome == 'success'
        run: |
          ${{ steps.container.outputs.exec }} bash -c '
            if [ -d .cache/source/bazel-testlogs ]; then
              mkdir -p .cache/dma-test-results
              rsync -aL --include="*/" --include=test.log --include=test.xml \
                --exclude="*" .cache/source/bazel-testlogs/ .cache/dma-test-results/
            fi
          '
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dma-tilelink-test-results
          path: .cache/dma-test-results/
          include-hidden-files: true
          if-no-files-found: error
  x86_64:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize source
        run: make submodule
      - name: Free runner disk
        run: |
          sudo find /usr/local/lib/android /usr/share/dotnet /opt/ghc -depth -delete 2>/dev/null || true
          df -h
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Set command prefix
        run: echo 'EXEC=${{ steps.container.outputs.exec }}' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: guest-fixtures
          path: fixtures
      - name: Cache ID
        id: cache-id
        run: echo "coralnpu=$(git rev-parse --short=12 HEAD:coralnpu)" >> "$GITHUB_OUTPUT"
      - name: Restore Bazel repository cache
        id: repos-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/repos/content_addressable
          key: downloads-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}
          restore-keys: downloads-${{ runner.arch }}-
      - name: Restore Bazel action cache
        id: actions-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/actions
          key: actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-${{ github.run_id }}
          restore-keys: |
            actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-
            actions-${{ runner.arch }}-
      - name: Build and package
        run: $EXEC make package
      - name: Test external archives
        run: make test
      - name: Upload verified archives
        uses: actions/upload-artifact@v7
        with:
          name: archives-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Preserve failed archives
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-x86_64
          path: dist/*
          if-no-files-found: ignore
      - name: Save Bazel repository cache
        id: repos-save
        if: success() && github.event_name != 'pull_request' && steps.repos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/repos/content_addressable
          key: ${{ steps.repos-cache.outputs.cache-primary-key }}
      - name: Save Bazel action cache
        id: actions-save
        if: always() && github.event_name != 'pull_request' && steps.actions-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/actions
          key: ${{ steps.actions-cache.outputs.cache-primary-key }}
      - name: Prune superseded caches
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ '${{ steps.actions-save.outcome }}' = success ] && scripts/prune-cache.sh actions-${{ runner.arch }}-
          [ '${{ steps.repos-save.outcome }}' = success ] && scripts/prune-cache.sh downloads-${{ runner.arch }}-
          exit 0
      - name: Disk usage
        if: always()
        run: |
          df -h
          du -sh .cache/repos .cache/actions || true
  aarch64:
    if: ${{ !inputs.x86_only }}
    needs: fixtures
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize source
        run: make submodule
      - name: Free runner disk
        run: |
          sudo find /usr/local/lib/android /usr/share/dotnet /opt/ghc -depth -delete 2>/dev/null || true
          df -h
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Set command prefix
        run: echo 'EXEC=${{ steps.container.outputs.exec }}' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: guest-fixtures
          path: fixtures
      - name: Cache ID
        id: cache-id
        run: echo "coralnpu=$(git rev-parse --short=12 HEAD:coralnpu)" >> "$GITHUB_OUTPUT"
      - name: Restore Bazel repository cache
        id: repos-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/repos/content_addressable
          key: downloads-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}
          restore-keys: downloads-${{ runner.arch }}-
      - name: Restore Bazel action cache
        id: actions-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/actions
          key: actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-${{ github.run_id }}
          restore-keys: |
            actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-
            actions-${{ runner.arch }}-
      - name: Build and package
        run: $EXEC make package
      - name: Test external archives
        run: make test
      - name: Upload verified archives
        uses: actions/upload-artifact@v7
        with:
          name: archives-aarch64
          path: dist/*
          if-no-files-found: error
      - name: Preserve failed archives
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-aarch64
          path: dist/*
          if-no-files-found: ignore
      - name: Save Bazel repository cache
        id: repos-save
        if: success() && github.event_name != 'pull_request' && steps.repos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/repos/content_addressable
          key: ${{ steps.repos-cache.outputs.cache-primary-key }}
      - name: Save Bazel action cache
        id: actions-save
        if: always() && github.event_name != 'pull_request' && steps.actions-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/actions
          key: ${{ steps.actions-cache.outputs.cache-primary-key }}
      - name: Prune superseded caches
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ '${{ steps.actions-save.outcome }}' = success ] && scripts/prune-cache.sh actions-${{ runner.arch }}-
          [ '${{ steps.repos-save.outcome }}' = success ] && scripts/prune-cache.sh downloads-${{ runner.arch }}-
          exit 0
      - name: Disk usage
        if: always()
        run: |
          df -h
          du -sh .cache/repos .cache/actions || true
  manifests:
    needs: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: assets
      - name: Compare host variants of each configuration
        run: |
          python3 scripts/validate_manifest.py --compare assets/*-x86_64/*.hardware-configurations.json assets/*-aarch64/*.hardware-configurations.json
