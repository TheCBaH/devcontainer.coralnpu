name: build
on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:
    inputs:
      x86_only:
        description: 'Skip the ARM64 builds'
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
  packages: write
concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize source
        run: make submodule
      - name: Free runner disk
        run: |
          sudo find /usr/local/lib/android /usr/share/dotnet /opt/ghc -depth -delete 2>/dev/null || true
          df -h
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Set command prefix
        run: echo 'EXEC=${{ steps.container.outputs.exec }}' >> "$GITHUB_ENV"
      - name: Cache Bazel inputs and actions
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/repos
            .cache/actions
          key: fixture-x86_64-${{ hashFiles('coralnpu/rules/repo_defs.bzl', '.devcontainer/**') }}
          restore-keys: fixture-x86_64-
      - name: Build guest fixtures
        run: $EXEC make fixtures
      - name: Upload guest fixtures
        uses: actions/upload-artifact@v7
        with:
          name: guest-fixtures
          path: |
            fixtures/*.elf
            fixtures/*.ld
          if-no-files-found: error
      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outputs.cache-primary-key != '' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/repos
            .cache/actions
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
  x86_64:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        archive: [emulators, libraries, subsystem]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize source
        run: make submodule
      - name: Free runner disk
        run: |
          sudo find /usr/local/lib/android /usr/share/dotnet /opt/ghc -depth -delete 2>/dev/null || true
          df -h
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Set command prefix
        run: echo 'EXEC=${{ steps.container.outputs.exec }}' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: guest-fixtures
          path: fixtures
      - name: Cache ID
        id: cache-id
        run: |
          echo "prefix=bazel-${{ runner.arch }}-${{ matrix.archive }}" >> "$GITHUB_OUTPUT"
          echo "coralnpu=$(git rev-parse --short=12 HEAD:coralnpu)" >> "$GITHUB_OUTPUT"
      - name: Cache Bazel inputs and actions
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/repos
            .cache/actions
          key: ${{ steps.cache-id.outputs.prefix }}-${{ steps.cache-id.outputs.coralnpu }}-${{ hashFiles('patches/**', 'mpact-patches/**', '.devcontainer/**', 'scripts/build.py') }}
          restore-keys: |
            ${{ steps.cache-id.outputs.prefix }}-${{ steps.cache-id.outputs.coralnpu }}-
            ${{ steps.cache-id.outputs.prefix }}-
            bazel-${{ runner.arch }}-
      - name: Build and package
        run: $EXEC make package ARCHIVES=${{ matrix.archive }}
      - name: Test external archives
        run: make test
      - name: Upload verified archives
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Preserve failed archives
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.archive }}-x86_64
          path: dist/*
          if-no-files-found: ignore
      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outputs.cache-primary-key != '' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/repos
            .cache/actions
          # A failed build must not claim the stable key.
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}${{ job.status != 'success' && format('-partial-{0}', github.run_id) || '' }}
      - name: Disk usage
        if: always()
        run: |
          df -h
          du -sh .cache/repos .cache/actions || true
  aarch64:
    if: ${{ !inputs.x86_only }}
    needs: fixtures
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        archive: [emulators, libraries, subsystem]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize source
        run: make submodule
      - name: Free runner disk
        run: |
          sudo find /usr/local/lib/android /usr/share/dotnet /opt/ghc -depth -delete 2>/dev/null || true
          df -h
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Set command prefix
        run: echo 'EXEC=${{ steps.container.outputs.exec }}' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: guest-fixtures
          path: fixtures
      - name: Cache ID
        id: cache-id
        run: |
          echo "prefix=bazel-${{ runner.arch }}-${{ matrix.archive }}" >> "$GITHUB_OUTPUT"
          echo "coralnpu=$(git rev-parse --short=12 HEAD:coralnpu)" >> "$GITHUB_OUTPUT"
      - name: Cache Bazel inputs and actions
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/repos
            .cache/actions
          key: ${{ steps.cache-id.outputs.prefix }}-${{ steps.cache-id.outputs.coralnpu }}-${{ hashFiles('patches/**', 'mpact-patches/**', '.devcontainer/**', 'scripts/build.py') }}
          restore-keys: |
            ${{ steps.cache-id.outputs.prefix }}-${{ steps.cache-id.outputs.coralnpu }}-
            ${{ steps.cache-id.outputs.prefix }}-
            bazel-${{ runner.arch }}-
      - name: Build and package
        run: $EXEC make package ARCHIVES=${{ matrix.archive }}
      - name: Test external archives
        run: make test
      - name: Upload verified archives
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}-aarch64
          path: dist/*
          if-no-files-found: error
      - name: Preserve failed archives
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.archive }}-aarch64
          path: dist/*
          if-no-files-found: ignore
      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outputs.cache-primary-key != '' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/repos
            .cache/actions
          # A failed build must not claim the stable key.
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}${{ job.status != 'success' && format('-partial-{0}', github.run_id) || '' }}
      - name: Disk usage
        if: always()
        run: |
          df -h
          du -sh .cache/repos .cache/actions || true
  manifests:
    needs: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: assets
      - name: Compare host variants of each configuration
        run: |
          python3 scripts/validate_manifest.py --compare assets/*-x86_64/*.hardware-configurations.json assets/*-aarch64/*.hardware-configurations.json
