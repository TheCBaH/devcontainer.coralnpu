name: trace
on:
  push:
    branches: [main, devel, 'trace-*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  actions: write
concurrency:
  group: trace-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  selection:
    name: Trace selection
    if: ${{ !startsWith(github.ref_name, 'trace-smoke') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize source
        run: make submodule
      - name: Free runner disk
        run: |
          sudo find /usr/local/lib/android /usr/share/dotnet /opt/ghc -depth -delete 2>/dev/null || true
          df -h
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache ID
        id: cache-id
        run: echo "coralnpu=$(git rev-parse --short=12 HEAD:coralnpu)" >> "$GITHUB_OUTPUT"
      - name: Restore Bazel repository cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/repos/content_addressable
          key: downloads-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}
          restore-keys: downloads-${{ runner.arch }}-
      - name: Restore Bazel action cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/actions
          key: actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-${{ github.run_id }}
          restore-keys: |
            actions-${{ runner.arch }}-${{ steps.cache-id.outputs.coralnpu }}-
            actions-${{ runner.arch }}-
      - name: Test trace selection
        run: ${{ steps.container.outputs.exec }} make trace-tests
  vcd-smoke:
    name: VCD smoke on a built archive
    # Runs scripts/smoke-vcd.sh on the emulator archive of the workflow run named in .smoke-run (its
    # archives-x86_64 or diagnostics-x86_64 artifact), so the script can be iterated on in minutes.
    if: startsWith(github.ref_name, 'trace-smoke')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(cat .smoke-run)
          for name in archives-x86_64 diagnostics-x86_64; do
            gh run download "$run" -n "$name" -D archive 2>/dev/null && break
          done
          mkdir -p bundle
          tar -xzf archive/coralnpu-emulators-linux-x86_64.tar.gz -C bundle
          cp scripts/smoke-vcd.sh bundle/coralnpu-emulators-linux-x86_64/smoke-vcd.sh
      - name: Smoke
        run: bash bundle/coralnpu-emulators-linux-x86_64/smoke-vcd.sh
