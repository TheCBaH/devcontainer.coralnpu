name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  validate:
    uses: ./.github/workflows/build.yml
    secrets: inherit
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: emulators-*
          path: assets
      - name: Verify and assemble assets
        run: |
          for directory in assets/emulators-*; do
            (cd "$directory" && sha256sum -c SHA256SUMS)
          done
          mkdir release
          cp assets/emulators-*/*.tar.gz release/
          cat assets/emulators-*/SHA256SUMS > release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
          test "$(find release -name '*.tar.gz' | wc -l)" -eq 2
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
