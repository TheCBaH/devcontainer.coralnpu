name: DMA and TileLink
on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: dma-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize source
        run: make submodule
      - name: Free runner disk
        run: |
          sudo find /usr/local/lib/android /usr/share/dotnet /opt/ghc -depth -delete 2>/dev/null || true
          df -h
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Cache Bazel inputs and actions
        uses: actions/cache@v6
        with:
          path: |
            .cache/repos
            .cache/actions
          key: dma-x86_64-${{ hashFiles('coralnpu/rules/repo_defs.bzl', '.devcontainer/**', 'patches/**', 'scripts/dma-tests.sh') }}
          restore-keys: |
            dma-x86_64-
            fixture-x86_64-
      - name: Test DMA, TileLink and DDR paths
        run: ${{ steps.container.outputs.exec }} make dma-tests
      - name: Collect test logs
        if: always() && steps.container.outcome == 'success'
        run: |
          ${{ steps.container.outputs.exec }} bash -c '
            if [ -d .cache/source/bazel-testlogs ]; then
              mkdir -p .cache/dma-test-results
              rsync -aL --include="*/" --include=test.log --include=test.xml \
                --exclude="*" .cache/source/bazel-testlogs/ .cache/dma-test-results/
            fi
          '
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dma-tilelink-test-results
          path: .cache/dma-test-results/
          include-hidden-files: true
          if-no-files-found: error
